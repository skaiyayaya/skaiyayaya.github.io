<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>skai’s garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #4b2a54;
        --pink: #ffb3d4;
        --hot: #e8629c;
        --cream: #fff4dc;
        --panel: #fff4dc;
        --text: #4b2a54;
        --px: "Press Start 2P", ui-monospace, monospace;
        --body: "VT323", ui-monospace, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --panel: #3a2142;
          --text: #ffe6f1;
          --ink: #ffb3d4;
        }
      }
      :root[data-theme="dark"] {
        --panel: #3a2142;
        --text: #ffe6f1;
        --ink: #ffb3d4;
      }
      * {
        box-sizing: border-box;
        cursor: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe0f5;
        font-family: var(--body);
        font-size: 22px;
        color: var(--text);
        image-rendering: pixelated;
        -webkit-user-select: none;
        user-select: none;
      }
      @media (pointer: coarse) {
        * {
          cursor: auto !important;
        }
        #wand {
          display: none;
        }
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      .hidden {
        display: none !important;
      }
      #glitter {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
      }
      #wand {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 101;
        pointer-events: none;
        image-rendering: pixelated;
        width: calc(32px * 1.5);
        height: calc(44px * 1.5);
        will-change: transform;
        transition: scale 0.12s steps(2);
      }
      #wand.pop {
        scale: 1.25;
      }

      #front {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: url(meadow.png) center/cover no-repeat;
        z-index: 50;
      }
      #front.leave {
        animation: out 0.6s steps(6) forwards;
      }
      @keyframes out {
        to {
          opacity: 0;
          filter: blur(0) brightness(1.6);
        }
      }
      .card {
        width: min(560px, 92vw);
        background: var(--panel);
        padding: 34px 28px 30px;
        text-align: center;
        box-shadow:
          0 -6px 0 0 var(--ink),
          0 6px 0 0 var(--ink),
          -6px 0 0 0 var(--ink),
          6px 0 0 0 var(--ink),
          0 14px 0 0 rgba(75, 42, 84, 0.35);
        animation: drop 0.8s steps(8) both;
      }
      @keyframes drop {
        from {
          transform: translateY(-40px);
          opacity: 0;
        }
      }
      h1 {
        font: 400 clamp(20px, 5.2vw, 34px) / 1.5 var(--px);
        margin: 0 0 6px;
        color: var(--hot);
        text-shadow: 3px 3px 0 var(--ink);
      }
      h1 span {
        display: inline-block;
        animation: bob 1.4s steps(2) infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-6px);
        }
      }
      .card p {
        margin: 10px 0 22px;
        font-size: 26px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      input {
        width: 230px;
        padding: 12px;
        background: #fff;
        border: 0;
        font-family: var(--px);
        font-size: 12px;
        color: #4b2a54;
        box-shadow: 0 0 0 4px var(--ink);
        text-align: center;
        outline: 0;
      }
      input:focus {
        box-shadow: 0 0 0 4px var(--hot);
      }
      .btn {
        font-family: var(--px);
        font-size: 12px;
        padding: 14px 16px;
        border: 0;
        background: var(--hot);
        color: #fff;
        box-shadow:
          0 0 0 4px var(--ink),
          0 8px 0 4px var(--ink);
        transition: transform 0.1s steps(2);
      }
      .btn:hover,
      .btn:focus-visible {
        transform: translateY(-3px);
        outline: 0;
        background: #ff7fb4;
      }
      .btn:active {
        transform: translateY(4px);
      }

      #garden {
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: none;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: calc(var(--tw) * 2);
        will-change: transform;
      }

      const P = [];
      const COL = [
        "#ff9ccb",
        "#ffb3d4",
        "#ff7fb4",
        "#ffd6e8",
        "#ffffff",
        "#ffc2e0",
      ];
      function spawn(x, y, n, burst) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * 6.28,
            v = burst ? 1 + Math.random() * 3 : Math.random() * 0.5;
          P.push({
            x,
            y,
            vx: Math.cos(a) * v - (burst ? 0 : 0.3),
            vy: Math.sin(a) * v + (burst ? -1 : 0),
            l: 0,
            m: (burst ? 40 : 35) + Math.random() * 45,
            s: Math.random() < 0.2 ? 6 : 3,
            c: COL[(Math.random() * COL.length) | 0],
          });
        }
      }
      addEventListener("pointermove", (e) => {
        px = e.clientX;
        py = e.clientY;
        if (lx !== null) {
          const d = Math.hypot(px - lx, py - ly),
            n = Math.min(8, Math.ceil(d / 9));
          for (let i = 0; i < n; i++)
            spawn(lx + ((px - lx) * i) / n, ly + ((py - ly) * i) / n, 2);
        }
        lx = px;
        ly = py;
        if (drag) {
          const dx = e.clientX - drag.x;
          if (Math.abs(dx) > 6) moved = true;
          target = clamp(drag.c - dx);
        }
        mx = e.clientX;
      });
      addEventListener("pointerdown", () => wand.classList.add("pop"));
      addEventListener("pointerup", () => wand.classList.remove("pop"));
      const snap = (v) => Math.round(v / 3) * 3;
      function loop() {
        wand.style.transform = `translate(${px - HX}px,${py - HY}px)`;
        if (!G.classList.contains("hidden")) {
          const sp = 14;
          if (keys.ArrowRight || keys.d || keys.D) target = clamp(target + sp);
          if (keys.ArrowLeft || keys.a || keys.A) target = clamp(target - sp);
          if (!drag && mx >= 0 && matchMedia("(pointer:fine)").matches) {
            if (mx < innerWidth * 0.07) target = clamp(target - 6);
            else if (mx > innerWidth * 0.93) target = clamp(target + 6);
          }
          cam += (target - cam) * 0.12;
          world.style.transform = `translate3d(${-Math.round(cam)}px,0,0)`;
        }
        cx.clearRect(0, 0, cv.width, cv.height);
        for (let i = P.length - 1; i >= 0; i--) {
          const p = P[i];
          p.l++;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.06;
          p.vx *= 0.98;
          if (p.l > p.m) {
            P.splice(i, 1);
            continue;
          }
          cx.globalAlpha = 1 - p.l / p.m;
          cx.fillStyle = p.c;
          const x = snap(p.x),
            y = snap(p.y);
          if (p.s === 6) {
            cx.fillRect(x - 3, y, 9, 3);
            cx.fillRect(x, y - 3, 3, 9);
          } else cx.fillRect(x, y, 3, 3);
        }
        cx.globalAlpha = 1;
        requestAnimationFrame(loop);
      }
      loop();

      const panel = $("panel");
      function openP(i) {
        const s = SECTIONS[i];
        $("ph").textContent = s.t;
        $("pp").replaceChildren(
          ...s.pills.map((t) => {
            const b = document.createElement("b");
            b.textContent = t;
            return b;
          }),
        );
        $("pb").replaceChildren(
          ...s.p.map((t) => {
            const p = document.createElement("p");
            p.textContent = t;
            return p;
          }),
        );
        panel.classList.remove("hidden");
        panel.style.animation = "none";
        panel.offsetHeight;
        panel.style.animation = "";
        panel.scrollTop = 0;
      }
      function closeP() {
        panel.classList.add("hidden");
      }
      $("x").addEventListener("click", closeP);
      world.addEventListener("click", (e) => {
        if (moved) return;
        const f = e.target.closest(".fl");
        if (!f) return;
        const r = f.getBoundingClientRect();
        spawn(r.left + r.width / 2, r.top + r.height * 0.25, 36, true);
        openP(+f.dataset.i);
      });

      $("f").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = $("code").value.trim() || "wanderer";
        $("hi").textContent = "hi, " + name;
        const fr = $("front");
        fr.classList.add("leave");
        spawn(innerWidth / 2, innerHeight / 2, 60, true);
        setTimeout(() => {
          fr.classList.add("hidden");
          G.classList.remove("hidden");
          cam = target = clamp((WW - innerWidth) / 2);
        }, 600);
      });
    </script>
  </body>
</html>
